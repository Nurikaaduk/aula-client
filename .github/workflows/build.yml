name: Build Aula Client

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - id: build
        run: gradle build --stacktrace
        continue-on-error: true

      - name: Dump Minecraft API (debug)
        if: always()
        run: |
          set +e
          MC=$(find "$GITHUB_WORKSPACE/.gradle/loom-cache" -name 'minecraft-merged-*.jar' | head -1)
          echo "=== find PlayerRenderState / PlayerModel paths"
          unzip -l "$MC" 2>/dev/null | grep -E "PlayerRenderState\.class$|/PlayerModel\.class$"
          echo "=== RenderLayerParent (entity pkg)"
          javap -public -cp "$MC" net.minecraft.client.renderer.entity.RenderLayerParent 2>&1 | head -10
          echo "=== SubmitNodeCollector"
          javap -public -cp "$MC" net.minecraft.client.renderer.SubmitNodeCollector 2>&1 | head -40
          echo "=== LivingEntityRenderLayerRegistrationCallback"
          RV1=$(find ~/.gradle -iname 'fabric-rendering-v1*.jar' 2>/dev/null | grep -v sources | head -1)
          javap -public -classpath "$MC:$RV1" net.fabricmc.fabric.api.client.rendering.v1.LivingEntityRenderLayerRegistrationCallback 2>&1 | head -20
          javap -public -classpath "$MC:$RV1" 'net.fabricmc.fabric.api.client.rendering.v1.LivingEntityRenderLayerRegistrationCallback$RegistrationHelper' 2>&1 | head -10
          echo "=== EntityModel / submitSinglePartModel hints"
          javap -public -cp "$MC" net.minecraft.client.renderer.entity.EntityRenderer 2>&1 | grep -iE "submit"
          javap -public -cp "$MC" net.minecraft.client.model.EntityModel 2>&1 | head -15
          set -e

      - if: steps.build.outcome == 'failure'
        run: exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: aula-client-jar
          path: build/libs/*.jar
