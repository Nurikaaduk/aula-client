name: Build Aula Client

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - id: build
        run: gradle build --stacktrace
        continue-on-error: true

      - name: Dump Minecraft API (debug)
        if: always()
        run: |
          set +e
          MC=$(find "$GITHUB_WORKSPACE/.gradle/loom-cache" -name 'minecraft-merged-*.jar' | head -1)
          echo "=== EntityType.PLAYER search"
          javap -public -cp "$MC" net.minecraft.world.entity.EntityType 2>&1 | grep -i "PLAYER"
          unzip -l "$MC" 2>/dev/null | grep -E "/EntityTypes?\.class$"
          javap -public -cp "$MC" net.minecraft.world.entity.EntityTypes 2>&1 | grep -i PLAYER
          echo "=== Minecraft render target"
          javap -public -cp "$MC" net.minecraft.client.Minecraft 2>&1 | grep -iE "rendertarget"
          echo "=== Gui chat"
          javap -public -cp "$MC" net.minecraft.client.gui.Gui 2>&1 | grep -iE "chat"
          set -e

      - if: steps.build.outcome == 'failure'
        run: exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: aula-client-jar
          path: build/libs/*.jar
