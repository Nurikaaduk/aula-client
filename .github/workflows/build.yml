name: Build Aula Client

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - id: build
        run: gradle build --stacktrace
        continue-on-error: true

      - name: Dump Minecraft API (debug)
        if: steps.build.outcome == 'failure'
        run: |
          MC=$(find "$GITHUB_WORKSPACE/.gradle/loom-cache" -name 'minecraft-merged-*.jar' | head -1)
          echo "=== InputConstants mouse"
          javap -public -constants -cp "$MC" com.mojang.blaze3d.platform.InputConstants | grep -Ei 'MOUSE'
          echo "=== MouseButtonInfo"
          javap -public -constants -cp "$MC" net.minecraft.client.input.MouseButtonInfo
          javap -public -constants -cp "$MC" 'net.minecraft.client.input.MouseButtonInfo$MouseButton'
          echo "=== MouseHandler"
          javap -p -cp "$MC" net.minecraft.client.MouseHandler | grep -Ei 'onButton|onPress|xpos|ypos|scale|mouseClicked|setup|button' | cut -c1-200

      - if: steps.build.outcome == 'failure'
        run: exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: aula-client-jar
          path: build/libs/*.jar
