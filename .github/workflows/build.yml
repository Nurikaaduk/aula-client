name: Build Aula Client

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - id: build
        run: gradle build --stacktrace
        continue-on-error: true

      - name: Dump Minecraft API (debug)
        if: always()
        run: |
          set +e
          MC=$(find "$GITHUB_WORKSPACE/.gradle/loom-cache" -name 'minecraft-merged-*.jar' | head -1)
          echo "=== OrderedSubmitNodeCollector"
          javap -public -cp "$MC" net.minecraft.client.renderer.OrderedSubmitNodeCollector 2>&1
          echo "=== ElytraLayer submit (vanilla reference, for render pattern)"
          javap -public -cp "$MC" net.minecraft.client.renderer.entity.layers.ElytraLayer 2>&1
          echo "=== Model (submitSinglePartModel?)"
          javap -public -cp "$MC" net.minecraft.client.model.Model 2>&1
          echo "=== PlayerModel ctor + fields"
          javap -public -cp "$MC" net.minecraft.client.model.player.PlayerModel 2>&1 | head -30
          echo "=== PlayerRenderState fields"
          javap -public -cp "$MC" net.minecraft.client.renderer.state.level.PlayerRenderState 2>&1
          set -e

      - if: steps.build.outcome == 'failure'
        run: exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: aula-client-jar
          path: build/libs/*.jar
