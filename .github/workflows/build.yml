name: Build Aula Client

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - id: build
        run: gradle build --stacktrace
        continue-on-error: true

      - name: Dump Minecraft API (debug)
        if: always()
        run: |
          MC=$(find "$GITHUB_WORKSPACE/.gradle/loom-cache" -name 'minecraft-merged-*.jar' | head -1)
          FAPI=$(find ~/.gradle -iname 'fabric-api*.jar' 2>/dev/null | grep -v sources | head -1)
          echo "=== PoseStack search"
          unzip -l "$MC" 2>/dev/null | grep -i "PoseStack.class" | head
          echo "=== fabric-api rendering jars"
          find ~/.gradle -iname '*fabric-rendering*.jar' 2>/dev/null | grep -v sources
          echo "=== Feature/RenderLayer registration callbacks in fabric api"
          for j in $(find ~/.gradle -iname 'fabric-*.jar' 2>/dev/null | grep -v sources); do
            unzip -l "$j" 2>/dev/null | grep -iE "RenderLayerRegist|FeatureRendererRegist|LivingEntityRenderLayer" 
          done
          echo "=== RenderLayer class"
          javap -public -cp "$MC" net.minecraft.client.renderer.entity.layers.RenderLayer 2>&1 | head -20
          echo "=== Screenshot class candidates"
          unzip -l "$MC" 2>/dev/null | grep -iE "/Screenshot.*class$"
          echo "=== SoundEvents.UI_BUTTON_CLICK field type"
          javap -public -cp "$MC" net.minecraft.sounds.SoundEvents 2>&1 | grep -i "UI_BUTTON_CLICK"
          echo "=== SimpleSoundInstance.forUI"
          javap -public -cp "$MC" net.minecraft.client.resources.sounds.SimpleSoundInstance 2>&1 | grep -i "forUI"

      - if: steps.build.outcome == 'failure'
        run: exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: aula-client-jar
          path: build/libs/*.jar
