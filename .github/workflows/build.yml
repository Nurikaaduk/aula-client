name: Build Aula Client

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - id: build
        run: gradle build --stacktrace
        continue-on-error: true

      - name: Dump Minecraft API (debug)
        if: always()
        run: |
          MC=$(find "$GITHUB_WORKSPACE/.gradle/loom-cache" -name 'minecraft-merged-*.jar' | head -1)
          echo "=== CharacterEvent"
          javap -public -cp "$MC" net.minecraft.client.input.CharacterEvent
          echo "=== KeyEvent"
          javap -public -cp "$MC" net.minecraft.client.input.KeyEvent
          echo "=== InputConstants keys"
          javap -public -constants -cp "$MC" com.mojang.blaze3d.platform.InputConstants | grep -E 'KEY_(BACKSPACE|ESCAPE|RETURN|ENTER|DELETE|TAB|SPACE|UP|DOWN)\b'
          echo "=== GuiEventListener keyboard"
          javap -public -cp "$MC" net.minecraft.client.gui.components.events.GuiEventListener | grep -Ei 'key|char|focus'
          echo "=== Minecraft getUser"
          javap -public -cp "$MC" net.minecraft.client.Minecraft | grep -Ei 'getUser'
          javap -public -cp "$MC" net.minecraft.client.User | grep -Ei 'getName|name'
          echo "=== Font"
          javap -public -cp "$MC" net.minecraft.client.gui.Font | grep -E 'plainSubstrByWidth|width\(java.lang.String'
          echo "=== CursorTypes"
          javap -public -constants -cp "$MC" com.mojang.blaze3d.platform.cursor.CursorTypes | head -20

      - if: steps.build.outcome == 'failure'
        run: exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: aula-client-jar
          path: build/libs/*.jar
