name: Build Aula Client

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - id: build
        run: gradle build --stacktrace
        continue-on-error: true

      - name: Dump Minecraft API (debug)
        if: always()
        run: |
          MC=$(find "$GITHUB_WORKSPACE/.gradle/loom-cache" -name 'minecraft-merged-*.jar' | head -1)
          echo "=== PlayerSkinWidget (members)"
          javap -p -cp "$MC" net.minecraft.client.gui.components.PlayerSkinWidget 2>&1 | cut -c1-230
          echo "=== PlayerSkinWidget (code: calls)"
          javap -p -c -cp "$MC" net.minecraft.client.gui.components.PlayerSkinWidget 2>&1 | grep -E '^  [a-z].*\(|invoke|getfield|putfield|new ' | sed -E 's/^\s+[0-9]+: //' | cut -c1-210 | head -150
          echo "=== Model.Simple"
          javap -p -cp "$MC" 'net.minecraft.client.model.Model$Simple' 2>&1 | cut -c1-200
          echo "=== Model"
          javap -public -cp "$MC" net.minecraft.client.model.Model 2>&1 | cut -c1-200 | head -30
          echo "=== PlayerSkin"
          javap -public -cp "$MC" net.minecraft.world.entity.player.PlayerSkin 2>&1 | cut -c1-200
          echo "=== Minecraft skin getters"
          javap -public -cp "$MC" net.minecraft.client.Minecraft | grep -Ei 'skin|getEntityModels|getGameProfile|modelManager'
          echo "=== PlayerSkinRenderCache"
          javap -public -cp "$MC" net.minecraft.client.renderer.PlayerSkinRenderCache 2>&1 | cut -c1-220 | head -30
          echo "=== ModelLayers PLAYER"
          javap -public -cp "$MC" net.minecraft.client.model.geom.ModelLayers 2>&1 | grep -E ' PLAYER' | head

      - if: steps.build.outcome == 'failure'
        run: exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: aula-client-jar
          path: build/libs/*.jar
