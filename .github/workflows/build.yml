name: Build Aula Client

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - id: build
        run: gradle build --stacktrace
        continue-on-error: true

      - name: Dump Minecraft API (debug)
        if: steps.build.outcome == 'failure'
        run: |
          MC=$(find "$GITHUB_WORKSPACE/.gradle/loom-cache" -name 'minecraft-merged-*.jar' | head -1)
          echo "MC=$MC"
          echo "=== Fabric jars with KeyMapping"
          for j in $(find ~/.gradle/caches/modules-2 -name 'fabric-*.jar'); do
            unzip -l "$j" 2>/dev/null | awk '{print $4}' | grep -i 'KeyMapping\|KeyBinding' | sed "s|^|$(basename $j): |"
          done | head -20
          echo "=== InputConstants shift"
          javap -public -constants -cp "$MC" com.mojang.blaze3d.platform.InputConstants | grep -Ei 'SHIFT|KEY_C;'
          echo "=== KeyMapping.Category"
          javap -public -cp "$MC" 'net.minecraft.client.KeyMapping$Category'
          echo "=== Gui"
          javap -public -cp "$MC" net.minecraft.client.gui.Gui | grep -Ei 'screen|hide|hud|debug|isShow' | head -30
          echo "=== Options hide/gui"
          javap -public -cp "$MC" net.minecraft.client.Options | grep -Ei 'gui|hud|hideGui' | head -20
          echo "=== Minecraft screen-ish"
          javap -public -cp "$MC" net.minecraft.client.Minecraft | grep -Ei 'static.*getInstance|screen|overlay' | head -30
          echo "=== Screen event methods"
          for c in net.minecraft.client.gui.components.events.GuiEventListener net.minecraft.client.gui.components.events.ContainerEventHandler net.minecraft.client.gui.components.events.AbstractContainerEventHandler; do
            javap -public -cp "$MC" "$c" | grep -Ei 'mouse|drag|scroll|release|click'
          done
          echo "=== GameRenderer"
          javap -public -cp "$MC" net.minecraft.client.renderer.GameRenderer | grep -Ei 'projection|aspect|fov' | head -20
          echo "=== Entity / LivingEntity / EquipmentSlot"
          javap -public -cp "$MC" net.minecraft.world.entity.Entity | grep -E ' getBbHeight| getX\(| getY\(| getZ\(| getDeltaMovement' 
          javap -public -cp "$MC" net.minecraft.world.entity.LivingEntity | grep -E 'getItemBySlot'
          javap -public -cp "$MC" net.minecraft.world.entity.EquipmentSlot | grep -E 'HEAD|CHEST|LEGS|FEET'
          echo "=== ParticleTypes"
          javap -public -cp "$MC" net.minecraft.core.particles.ParticleTypes | grep -E ' (HEART|END_ROD|FLAME|CLOUD|NOTE|HAPPY_VILLAGER|ENCHANT);'
          echo "=== Identifier"
          javap -public -cp "$MC" net.minecraft.resources.Identifier | grep -E 'fromNamespaceAndPath'
          echo "=== Category register"
          javap -public -cp "$MC" net.minecraft.client.OptionInstance | grep -E ' get\(| set\('

      - if: steps.build.outcome == 'failure'
        run: exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: aula-client-jar
          path: build/libs/*.jar
