name: Build Aula Client

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - id: build
        run: gradle build --stacktrace
        continue-on-error: true

      - name: Dump Minecraft API (debug)
        if: always()
        run: |
          MC=$(find "$GITHUB_WORKSPACE/.gradle/loom-cache" -name 'minecraft-merged-*.jar' | head -1)
          echo "=== Projection"
          javap -p -cp "$MC" net.minecraft.client.renderer.Projection | cut -c1-220
          echo "=== ProjectionMatrixBuffer"
          javap -p -cp "$MC" net.minecraft.client.renderer.ProjectionMatrixBuffer | cut -c1-220
          echo "=== Users of Projection (classes referencing it)"
          mkdir -p /tmp/x && cd /tmp/x && unzip -q -o "$MC" 'net/minecraft/client/*' 
          grep -rl 'renderer/Projection' net | head -20
          echo "=== Camera all"
          javap -p -cp "$MC" net.minecraft.client.Camera | grep -Ei 'projection|fov|aspect|setup|perspective' | cut -c1-200

      - if: steps.build.outcome == 'failure'
        run: exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: aula-client-jar
          path: build/libs/*.jar
