name: Build Aula Client

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - id: build
        run: gradle build --stacktrace
        continue-on-error: true

      - name: Dump Minecraft API (debug)
        if: steps.build.outcome == 'failure'
        run: |
          MC=$(find "$GITHUB_WORKSPACE/.gradle/loom-cache" -name 'minecraft-merged-*.jar' | head -1)
          echo "=== class presence"
          unzip -l "$MC" | awk '{print $4}' | grep -E 'screens/TitleScreen.class|SelectWorldScreen.class|JoinMultiplayerScreen.class|screens/options/OptionsScreen.class|RealmsMainScreen.class|net/minecraft/SharedConstants.class|screens/Screen.class$' 
          for c in net.minecraft.client.gui.screens.TitleScreen net.minecraft.client.gui.screens.worldselection.SelectWorldScreen net.minecraft.client.gui.screens.multiplayer.JoinMultiplayerScreen net.minecraft.client.gui.screens.options.OptionsScreen com.mojang.realmsclient.RealmsMainScreen; do
            echo "=== $c"; javap -public -cp "$MC" "$c" 2>&1 | grep -E 'Error|class |  public .*\(net.minecraft.client.gui.screens.Screen|OptionsScreen\(' | head -8
          done
          echo "=== Screen close/init"
          javap -p -cp "$MC" net.minecraft.client.gui.screens.Screen | grep -Ei 'closeOnEsc|onClose|init\(|removed|added|tick'
          echo "=== Minecraft stop"
          javap -public -cp "$MC" net.minecraft.client.Minecraft | grep -E ' stop\(|isRunning|getVersion'
          echo "=== Screen fields"
          javap -p -cp "$MC" net.minecraft.client.gui.screens.Screen | grep -E ' (width|height|minecraft|font|title);'
          echo "=== Fabric screen api"
          J=$(find ~/.gradle/caches/modules-2 -name 'fabric-screen-api-v1*.jar' | grep -v sources | head -1)
          javap -public -cp "$J" net.fabricmc.fabric.api.client.screen.v1.ScreenEvents 2>&1 | head -20

      - if: steps.build.outcome == 'failure'
        run: exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: aula-client-jar
          path: build/libs/*.jar
