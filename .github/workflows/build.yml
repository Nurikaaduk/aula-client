name: Build Aula Client

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - id: build
        run: gradle build --stacktrace
        continue-on-error: true

      - name: Dump Minecraft API (debug)
        if: always()
        run: |
          MC=$(find "$GITHUB_WORKSPACE/.gradle/loom-cache" -name 'minecraft-merged-*.jar' | head -1)
          echo "=== Classes with Projection/Aspect/Camera in name"
          unzip -l "$MC" | awk '{print $4}' | grep -Ei 'projection|aspect' | head -30
          echo "=== GameRenderer methods"
          javap -public -cp "$MC" net.minecraft.client.renderer.GameRenderer | cut -c1-200 | head -80
          echo "=== Camera"
          javap -public -cp "$MC" net.minecraft.client.Camera | grep -Ei 'projection|fov|aspect|matrix' | head
          echo "=== KeyMappingHelper"
          J=$(find ~/.gradle/caches/modules-2 -name 'fabric-key-mapping-api-v1*.jar' | grep -v sources | head -1)
          javap -public -cp "$J" net.fabricmc.fabric.api.client.keymapping.v1.KeyMappingHelper
          echo "=== Hud class"
          javap -public -cp "$MC" net.minecraft.client.gui.Hud | grep -Ei 'hidden|hide|visible|show' | head
          echo "=== Option fov / Matrix users"
          unzip -l "$MC" | awk '{print $4}' | grep -Ei 'renderer/(Perspective|Projection|CameraRenderState|GlobalSettings)' | head

      - if: steps.build.outcome == 'failure'
        run: exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: aula-client-jar
          path: build/libs/*.jar
